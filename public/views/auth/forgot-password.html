<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — AlphaForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/auth.css" />
</head>
<body class="auth-page">

  <div class="auth-single-page">

    <div class="auth-card">

      <!-- Logo (centered, smaller) -->
      <div class="auth-card-logo">
        <div class="brand brand--centered">
          <div class="brand-logo brand-logo--sm">
            <svg width="28" height="28" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect width="36" height="36" rx="8" fill="#2563eb"/>
              <path d="M18 6L28 28H8L18 6Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
              <line x1="12" y1="20" x2="24" y2="20" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
              <circle cx="18" cy="6" r="2" fill="#60a5fa"/>
            </svg>
          </div>
          <span class="brand-name brand-name--sm">AlphaForge</span>
        </div>
      </div>

      <!-- Back link -->
      <a href="login.html" class="back-link" aria-label="Back to sign in">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M10 3L5 8L10 13" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back to sign in
      </a>

      <div class="auth-card-header">
        <h1 class="auth-title">Reset your password</h1>
        <p class="auth-subtitle">Enter your email address and we'll send you a link to reset your password.</p>
      </div>

      <!-- Error alert -->
      <div id="forgot-error" class="alert alert-error" role="alert" aria-live="polite" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="8" cy="8" r="7" stroke="#ef4444" stroke-width="1.5"/>
          <line x1="8" y1="4" x2="8" y2="9" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="8" cy="11.5" r="0.75" fill="#ef4444"/>
        </svg>
        <span class="alert-message"></span>
      </div>

      <!-- Success state (shown after submission) -->
      <div id="forgot-success" class="success-state" role="status" aria-live="polite" hidden>
        <div class="success-icon">
          <svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Email sent">
            <rect width="56" height="56" rx="12" fill="#0f1629"/>
            <rect x="8" y="16" width="40" height="28" rx="4" stroke="#2563eb" stroke-width="1.5"/>
            <path d="M8 20L28 32L48 20" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="8" y1="20" x2="28" y2="32" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="48" y1="20" x2="28" y2="32" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <h2 class="success-title">Check your email!</h2>
        <p class="success-message">We've sent password reset instructions to your email address.</p>
        <p class="success-note">
          Didn't receive it? Check your spam folder or
          <button id="resend-btn" type="button" class="resend-btn">click here to resend</button>
        </p>
      </div>

      <!-- Forgot password form -->
      <form id="forgot-form" novalidate>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            placeholder="trader@example.com"
            autocomplete="email"
            required
          />
          <div class="field-error" id="email-error" role="alert" hidden></div>
        </div>

        <button id="forgot-btn" type="submit" class="af-btn af-btn-primary full-width">
          <span class="btn-label">Send Reset Link</span>
          <svg class="btn-spinner" width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display:none">
            <circle cx="9" cy="9" r="7" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
            <path d="M9 2A7 7 0 0 1 16 9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>

      </form>

      <p class="auth-switch">
        Remember your password?
        <a href="login.html" class="auth-link">Sign in</a>
      </p>

    </div>

  </div>

  <script src="../../assets/js/api.js" defer></script>
  <script src="../../assets/js/auth.js" defer></script>
</body>
</html>
