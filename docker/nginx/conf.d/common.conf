# =============================================================================
# AlphaForge — Nginx Common Location Block Configuration
# Included by both HTTP and HTTPS server blocks.
# =============================================================================

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

# Hide Nginx version
server_tokens off;

# Rate limit on general requests
limit_req zone=general_limit burst=30 nodelay;
limit_req_status 429;

# Favicon — suppress 404 logging
location = /favicon.ico {
    access_log off;
    log_not_found off;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# Robots.txt
location = /robots.txt {
    access_log off;
    log_not_found off;
}

# Health check endpoint (bypass rate limiting)
location = /health {
    limit_req off;
    access_log off;
    try_files $uri /index.php?$query_string;
}

# Block access to hidden files and directories
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# Block access to sensitive files
location ~* \.(env|log|sql|conf|bak|backup|sh|git|gitignore|htpasswd|htaccess|DS_Store)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# Block access to PHP files in upload/storage directories
location ~* ^/(storage|uploads)/.*\.php$ {
    deny all;
    return 403;
}

# Static assets — aggressive caching with immutable hint
location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|css|js|map)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    try_files $uri =404;
}

# API endpoints — stricter rate limiting
location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    limit_req_status 429;
    try_files $uri /index.php?$query_string;
    fastcgi_pass php_fpm;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_read_timeout 120s;
    fastcgi_send_timeout 120s;
    fastcgi_connect_timeout 10s;
    fastcgi_buffer_size 64k;
    fastcgi_buffers 16 64k;
    fastcgi_busy_buffers_size 128k;
}

# Auth endpoints — tightest rate limiting
location ~* ^/api/(auth|login|register|password) {
    limit_req zone=auth_limit burst=5 nodelay;
    limit_req_status 429;
    try_files $uri /index.php?$query_string;
    fastcgi_pass php_fpm;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_read_timeout 30s;
}

# Main application — route all requests through index.php
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# PHP-FPM handler
location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass php_fpm;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param HTTP_PROXY "";
    fastcgi_read_timeout 120s;
    fastcgi_send_timeout 120s;
    fastcgi_connect_timeout 10s;
    fastcgi_buffer_size 64k;
    fastcgi_buffers 16 64k;
    fastcgi_busy_buffers_size 128k;
    fastcgi_intercept_errors off;
}
