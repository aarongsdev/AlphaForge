[opcache]
; Enable OPcache
opcache.enable=1
opcache.enable_cli=0

; Memory allocation
; Amount of memory for caching precompiled PHP code (in megabytes)
opcache.memory_consumption=256

; Amount of memory for interned strings (in megabytes)
opcache.interned_strings_buffer=32

; Maximum number of files that can be cached
opcache.max_accelerated_files=20000

; Maximum percentage of wasted memory before a scheduled restart
opcache.max_wasted_percentage=10

; Validate timestamps interval (0 = always validate, -1 = never)
; Set to 0 in development, 60+ in production
opcache.revalidate_freq=60

; Enable fast shutdown sequence to free memory faster
opcache.fast_shutdown=1

; Validate file timestamps (disable in production for max performance)
opcache.validate_timestamps=0

; Check that file contents have not changed (disable for performance)
opcache.consistency_checks=0

; Enable file cache (persistent across process restarts)
opcache.file_cache=/tmp/opcache
opcache.file_cache_consistency_checks=1

; Maximum depth of nested inheritance (PHP 8.x)
; opcache.max_file_size=0

; Enable huge code pages for improved performance on Linux
opcache.huge_code_pages=1

; Preload script (Laravel/custom preloader)
; opcache.preload=/var/www/html/bootstrap/preload.php
; opcache.preload_user=www-data

; JIT compiler settings (PHP 8.x)
; tracing JIT provides best performance for long-running PHP-FPM
opcache.jit=tracing
opcache.jit_buffer_size=128M

; Protect shared memory from unexpected writes during script execution
opcache.protect_memory=0

; Log verbosity level (0=no logging, 1=fatal errors, 2=warnings, 3=info, 4=debug)
opcache.log_verbosity_level=1

; Enable inheritance cache to reduce redundant processing
opcache.enable_file_override=0

; Save comments for reflection (required by some frameworks)
opcache.save_comments=1

; Enable optimization passes
opcache.optimization_level=0x7FFEBFFF
